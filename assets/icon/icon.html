<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap" rel="stylesheet" />
    <style>
      /* ══════════════════════════════════════════════════════════════
         tofig plugin icon — master for the PNG set.

         The site as an icon: tofig.aca.so's own `void` ground, a paper
         mark, and one violet source behind it.

         The glyph is Sora, set live. It was briefly redrawn as hand-made
         vector paths to remove the webfont dependency, and the drawn
         letterform was rejected — Sora's own `t`, with its long curled
         tail, is the mark. The dependency is real but it is confined to
         *regeneration*: the shipped artefacts are PNGs, and the script
         waits on document.fonts.ready before it captures, so a missed
         font fails loudly rather than shipping a system-ui fallback.

         The favicon still needs outlines, since no browser will load a
         webfont for an SVG favicon. mark.svg carries Sora's real `t` and
         `/` contours, extracted from the font file rather than redrawn,
         so the two surfaces show the same letterform.

         Colour choices, all measured against real 32px downscales:
         · Paper mark, not violet. A violet `t/` on `void` lost the glyph
           entirely at 32px — that variant was rejected on legibility.
         · The rim is load-bearing, not decoration. Figma masks the icon
           to a rounded square and shows it on light OR dark menu chrome;
           without the violet rim the tile has no edge on dark.
         · A paper GROUND was also tried and rejected: a white tile on
           Figma's light chrome has no edge at all.

         FULL-BLEED on purpose. Figma applies its own rounded mask, so
         baking corners in would composite to white behind the mask.
         Render large, downscale — see assets/marketing/render.mjs.
         ══════════════════════════════════════════════════════════════ */
      html, body { margin: 0; padding: 0; background: #000; }

      .icon {
        width: 100vw; height: 100vw;
        position: relative; overflow: hidden;
        /* --void, verbatim from the site's token layer. */
        background: oklch(0.135 0.018 288);
        display: flex; align-items: center; justify-content: center;
        font-family: "Sora", system-ui, -apple-system, sans-serif;
      }

      /* One violet source behind the mark — the canvas lit by the object
         sitting on it, the same move the hero makes — plus the rim that
         holds the tile's edge against dark chrome. Sized in vw so the
         mark is resolution-independent at any render size. */
      .icon::before {
        content: ""; position: absolute; inset: 0; z-index: 1;
        box-shadow: inset 0 0 0 1.2vw oklch(0.588 0.212 284 / 0.34);
        background: radial-gradient(78% 64% at 50% 40%,
                    oklch(0.588 0.212 284 / 0.30), transparent 72%);
      }

      .glyph {
        position: relative; z-index: 2;
        color: oklch(0.995 0 0);          /* --paper */
        font-size: 52vw; line-height: 1;
        letter-spacing: -0.06em;
        display: inline-flex; align-items: baseline;
        /* Optically centred, not metrically. Two corrections: the pair
           leans right off the slash's diagonal, and neither glyph has a
           descender, so the line box reserves space below the baseline
           that no ink uses and the mark rides high without the nudge. */
        transform: translate(-1.5%, 7%);
      }
      /* The wordmark's contrast at monogram scale: the letter carries
         `to`'s lightness, the slash carries `fig`'s mass. 300 rather than
         150 because Figma renders this at 32px in its own plugin menus,
         and below 300 the stem breaks up at that size. */
      .glyph .t { font-weight: 300; }
      .glyph .s { font-weight: 600; margin-left: -0.03em; }
    </style>
  </head>
  <body>
    <div class="icon" role="img" aria-label="tofig icon">
      <span class="glyph"><span class="t">t</span><span class="s">/</span></span>
    </div>
  </body>
</html>
