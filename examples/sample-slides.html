<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
      .slide {
        width: 1920px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center;
        padding: 140px; color: #fff;
      }
      .s1 { background: linear-gradient(135deg, #4f46e5, #9333ea); }
      .s2 { background: #0b1020; }
      h1 { font-size: 96px; font-weight: 800; line-height: 1.05; }
      h2 { font-size: 64px; font-weight: 700; color: #22d3ee; }
      p { font-size: 36px; color: #cbd5e1; margin-top: 24px; max-width: 1200px; line-height: 1.4; }
      .kicker { font-size: 24px; font-weight: 700; letter-spacing: 0.2em; color: #c4b5fd; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <section class="slide s1">
      <div class="kicker">TOFIG</div>
      <h1>HTML → Figma Slides</h1>
      <p>Author decks as HTML and import them as native, editable slides.</p>
    </section>
    <section class="slide s2">
      <h2>How it works</h2>
      <p>Paste HTML, we render it in a real browser, then rebuild every box, text and vector as Figma nodes.</p>
    </section>
  </body>
</html>
